# Entorno CPU de GEMA MX para los procesos Nextflow (M1-M5, solo CPU).
#
# Versiones fijadas a partir del lock validado del proyecto Gemacont
# (env/cpu-lock.yml) para que las estructuras, el docking y las métricas
# se calculen con las mismas herramientas.
#
# Se resuelve con micromamba/conda-forge. El dockeo usa Vina 1.2.7 y
# Open Babel 3.2.1; RDKit 2026.03.1 + Meeko 0.8.0 preparan los ligandos.
name: gemamx
channels:
  - conda-forge
dependencies:
  - python=3.12.15
  - biopython=1.88
  - numpy=2.5.4
  - pandas=2.3.3
  - rdkit=2026.03.1
  - openbabel=3.2.1
  - vina=1.2.7
  - requests
  - scipy
  - pip
  - pip:
      - mlflow==2.19.0
      - meeko==0.8.0
      - gemmi==0.7.5
