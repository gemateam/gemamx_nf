<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Molstar Viewer</title>
  <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/pdbe-molstar@3.10.0/build/pdbe-molstar.css" />
  <script type="text/javascript"
          src="https://cdn.jsdelivr.net/npm/pdbe-molstar@3.10.0/build/pdbe-molstar-component.js">
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a14; overflow: hidden; }
    pdbe-molstar { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <pdbe-molstar id="viewer"
    bg-color-r="10" bg-color-g="10" bg-color-b="20"
    hide-controls="false"
    select-interaction="false"
    pdbe-link="false"
    sequence-panel="false">
  </pdbe-molstar>

  <script>
    // Mensaje pendiente si llega antes de que Molstar esté listo
    let pendingMsg = null;
    let molstarReady = false;

    function applyMessage(data) {
      const el = document.getElementById('viewer');
      if (!el) return;

      const { url, format, mutPos, selection } = data;
      if (!url) return;

      el.setAttribute('custom-data-format', format || 'mmcif');
      el.setAttribute('custom-data-url', url);

      // Resaltar residuos tras carga
      const highlights = selection || (mutPos ? [{ residue_number: mutPos, color: { r: 255, g: 100, b: 50 }, focus: true }] : null);
      if (highlights) {
        const onLoad = () => {
          try {
            el.viewerInstance?.visual.select({
              data: highlights,
              nonSelectedColor: null,
            });
          } catch(_) {}
          el.removeEventListener('load', onLoad);
        };
        el.addEventListener('load', onLoad);
      }
    }

    // Esperar a que el Web Component esté registrado y listo
    function waitForMolstar(callback, tries = 0) {
      const el = document.getElementById('viewer');
      if (el && customElements.get('pdbe-molstar')) {
        molstarReady = true;
        callback();
      } else if (tries < 50) {
        setTimeout(() => waitForMolstar(callback, tries + 1), 100);
      }
    }

    waitForMolstar(() => {
      if (pendingMsg) {
        applyMessage(pendingMsg);
        pendingMsg = null;
      }
    });

    // Recibir mensajes del padre para cargar estructuras
    window.addEventListener('message', function(event) {
      if (event.data?.type !== 'loadStructure') return;
      if (molstarReady) {
        applyMessage(event.data);
      } else {
        // Guardar el último mensaje; se aplica cuando Molstar esté listo
        pendingMsg = event.data;
      }
    });
  </script>
</body>
</html>
