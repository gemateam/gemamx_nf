# =============================================================================
# GEMA MX — Stack local autónomo del pipeline gemamx_nf
#
# Servicios:
#   postgres → Base de datos de MLflow (inicializada con corridas históricas)
#   mlflow   → Servidor de tracking y artefactos en http://localhost:5000
#   webapp   → Aplicación web interactiva en http://localhost:8080
#
# Uso habitual:
#   docker compose up -d          # levantar todos los servicios
#   docker compose logs -f mlflow # ver logs de MLflow
#   docker compose down           # detener
# =============================================================================

services:

  # ── PostgreSQL para MLflow ─────────────────────────────────────────────
  postgres:
    image: postgres:16.4-bookworm
    container_name: gemamx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gemamx
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
      - gemamx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemamx -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gemamx_net

  # ── Servidor MLflow ────────────────────────────────────────────────────
  mlflow:
    image: gemamx-mlflow:1.0.0
    container_name: gemamx_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://gemamx:change-me@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./infra/mlflow/artifacts:/mlflow/artifacts
      - ./infra/mlflow/mlartifacts:/mlartifacts
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gemamx_net

  # ── Web App estática ───────────────────────────────────────────────────
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: gemamx-webapp:1.0.0
    container_name: gemamx_webapp
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Contrato vigente → accesible como /data/top_variants.json etc.
      - ./results/data:/usr/share/nginx/html/data:ro
      # Historial de corridas → ruta separada para evitar conflicto de mounts
      - ./results/runs:/usr/share/nginx/html/runs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gemamx_net

volumes:
  gemamx_pgdata:
    name: gemamx_pgdata

networks:
  gemamx_net:
    name: gemamx_net
