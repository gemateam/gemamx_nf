# =============================================================================
# GEMA MX — Stack local del pipeline gemamx_nf
#
# Servicios:
#   webapp   → app web estática servida por Nginx
#
# El servidor MLflow NO se define aquí: se asume que ya corre en la red
# gemacont_default (gemacont-mlflow-1 / gemamx-mlflow:1.0.0).
# Si se necesita un MLflow local independiente, usar el perfil "standalone":
#   docker compose --profile standalone up -d
#
# La webapp monta results/data/ (contrato vigente) y results/runs/
# (historial de corridas) en modo read-only.
#
# Uso habitual:
#   docker compose up -d webapp       # levantar/recargar solo la webapp
#   docker compose logs -f webapp     # ver logs
#   docker compose down               # parar
# =============================================================================

services:

  # ── Web App estática ───────────────────────────────────────────────────
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: gemamx-webapp:1.0.0
    container_name: gemamx_webapp
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Contrato vigente → accesible como /data/top_variants.json etc.
      - ./results/data:/usr/share/nginx/html/data:ro
      # Historial de corridas → ruta separada para evitar conflicto de mounts
      - ./results/runs:/usr/share/nginx/html/runs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MLflow standalone (opcional, solo si no hay gemacont corriendo) ────
  mlflow:
    profiles: ["standalone"]
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: gemamx_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts
        --serve-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mlflow_data:
    name: gemamx_mlflow_data
